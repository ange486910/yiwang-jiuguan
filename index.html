<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>遗忘酒馆</title>
<style>
  :root{
    --bg:#F7F8F7;
    --ink:#22282A;
    --sub:#6B7472;
    --green:#2F6B57;
    --green-soft:#E4EDE8;
    --card:rgba(255,255,255,.72);
    --line:rgba(34,40,42,.10);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;margin:0}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    line-height:1.8;
    letter-spacing:.02em;
    display:flex;align-items:center;justify-content:center;
    padding:16px;
    overflow:hidden;
  }
  .app{
    width:100%;max-width:520px;height:100%;max-height:860px;
    display:flex;flex-direction:column;
    background:var(--card);
    backdrop-filter:blur(18px);
    -webkit-backdrop-filter:blur(18px);
    border:1px solid var(--line);
    border-radius:20px;
    box-shadow:0 12px 40px rgba(20,40,34,.08);
    overflow:hidden;
  }

  /* ---------- 顶部状态 ---------- */
  .top{
    padding:16px 20px 14px;
    border-bottom:1px solid var(--line);
    background:rgba(255,255,255,.55);
    position:relative;
  }
  .top h1{
    margin:0;font-size:15px;font-weight:600;letter-spacing:.18em;
    color:var(--green);
  }
  .avatar{
    position:absolute;right:20px;top:15px;width:40px;height:40px;
    border-radius:50%;object-fit:cover;object-position:50% 28%;
    border:1px solid rgba(47,107,87,.25);
    filter:saturate(.85) contrast(.98);
  }
  .top .sub{margin:2px 0 12px;font-size:11px;color:var(--sub);letter-spacing:.1em}
  .bars{display:flex;gap:14px}
  .bar{flex:1}
  .bar .lab{display:flex;justify-content:space-between;font-size:11px;color:var(--sub);margin-bottom:5px}
  .track{height:4px;border-radius:4px;background:rgba(47,107,87,.12);overflow:hidden}
  .fill{height:100%;width:0%;border-radius:4px;background:var(--green);transition:width .5s ease}

  /* ---------- 对话区 ---------- */
  .stage{flex:1;overflow-y:auto;padding:22px 18px 8px;scroll-behavior:smooth}
  .stage::-webkit-scrollbar{width:0}

  .narr{font-size:13px;color:var(--sub);line-height:2;margin:0 0 18px;text-align:center;letter-spacing:.06em}

  .row{display:flex;margin-bottom:14px}
  .row.me{justify-content:flex-end}
  .bubble{
    max-width:78%;padding:11px 15px;border-radius:14px;font-size:14px;
    animation:up .35s ease both;
  }
  .bubble.npc{
    background:#fff;border:1px solid var(--line);
    border-bottom-left-radius:4px;
    color:#2B3335;
  }
  .bubble.user{
    background:var(--green);color:#fff;border-bottom-right-radius:4px;
  }
  @keyframes up{from{transform:translateY(6px)}to{transform:none}}

  .thinking{font-size:12px;color:var(--sub);padding-left:4px;margin-bottom:14px}

  /* ---------- 选项 ---------- */
  .choices{margin:6px 0 18px;animation:up .4s ease both}
  .choices .q{
    font-size:13px;color:var(--green);text-align:center;
    letter-spacing:.1em;margin:0 0 14px;
  }
  .choice{
    width:100%;text-align:left;cursor:pointer;
    background:#fff;border:1px solid var(--line);border-radius:14px;
    padding:13px 16px;margin-bottom:10px;font-family:inherit;
    transition:.2s;
  }
  .choice:hover{border-color:rgba(47,107,87,.45);box-shadow:0 6px 18px rgba(47,107,87,.10)}
  .choice .t{font-size:14px;color:var(--ink);display:block}
  .choice .d{font-size:11px;color:var(--sub);display:block;margin-top:3px}
  .tip{font-size:11px;color:var(--sub);text-align:center;margin-top:8px}

  /* ---------- 底部输入 ---------- */
  .bottom{
    padding:12px 16px calc(12px + env(safe-area-inset-bottom));
    border-top:1px solid var(--line);
    background:rgba(255,255,255,.6);
  }
  .composer{display:flex;gap:8px}
  .composer input{
    flex:1;border:1px solid var(--line);background:#fff;border-radius:12px;
    padding:11px 14px;font-size:13px;font-family:inherit;color:var(--ink);outline:none;
  }
  .composer input:focus{border-color:rgba(47,107,87,.45)}
  .composer button{
    border:none;background:var(--green);color:#fff;border-radius:12px;
    padding:0 18px;font-size:13px;font-family:inherit;letter-spacing:.08em;cursor:pointer;
  }
  .composer button:disabled{opacity:.5;cursor:default}
  .meta{display:flex;justify-content:space-between;align-items:center;margin-top:8px}
  .meta .hint{font-size:10px;color:var(--sub)}
  .meta .reset{
    background:none;border:none;font-size:10px;color:var(--sub);
    text-decoration:underline;cursor:pointer;font-family:inherit;padding:0;
  }

  /* ---------- 结局层 ---------- */
  .ending{
    position:absolute;inset:0;display:none;
    flex-direction:column;justify-content:center;
    padding:36px 26px;background:var(--bg);z-index:9;
    overflow-y:auto;
  }
  .app{position:relative}
  .ending.on{display:flex;animation:fade .5s ease both}
  @keyframes fade{from{transform:translateY(8px)}to{transform:none}}
  .ending .tag{font-size:11px;letter-spacing:.3em;color:var(--sub);margin-bottom:10px}
  .hero{
    width:calc(100% + 52px);margin:-36px -26px 20px;
    height:32vh;max-height:250px;min-height:150px;
    object-fit:cover;object-position:50% 42%;
    -webkit-mask-image:linear-gradient(to bottom,#000 68%,transparent 100%);
    mask-image:linear-gradient(to bottom,#000 68%,transparent 100%);
  }
  .hero[data-empty]{display:none}
  .ending h2{
    font-size:26px;font-weight:600;letter-spacing:.2em;color:var(--green);margin:0 0 26px;
  }
  .ending p{font-size:14px;line-height:2.1;color:#39413F;margin:0 0 14px;white-space:pre-line}
  .ending .coda{
    font-size:13px;color:var(--green);border-top:1px solid var(--line);
    padding-top:18px;margin-top:22px;letter-spacing:.04em;
  }
  .ending .again{
    margin-top:28px;align-self:flex-start;background:var(--green);color:#fff;
    border:none;border-radius:12px;padding:12px 22px;font-size:13px;
    font-family:inherit;letter-spacing:.1em;cursor:pointer;
  }
</style>
</head>
<body>
<div class="app" id="app">

  <div class="top">
    <img class="avatar" src="awen.jpg" alt="阿晚" onerror="this.style.display='none'">
    <h1>遗忘酒馆</h1>
    <div class="sub">不卖酒，只收记忆</div>
    <div class="bars">
      <div class="bar">
        <div class="lab"><span>信任</span><span id="trustNum">40</span></div>
        <div class="track"><div class="fill" id="trustBar" style="width:40%"></div></div>
      </div>
      <div class="bar">
        <div class="lab"><span>秘密</span><span id="secretNum">0</span></div>
        <div class="track"><div class="fill" id="secretBar" style="width:0%"></div></div>
      </div>
    </div>
  </div>

  <div class="stage" id="stage"></div>

  <div class="bottom" id="bottom">
    <div class="composer">
      <input id="input" placeholder="说点什么，或者什么都不说" autocomplete="off" maxlength="120">
      <button id="send">说</button>
    </div>
    <div class="meta">
      <span class="hint" id="hint">她在等你开口。</span>
      <button class="reset" id="reset">重来</button>
    </div>
  </div>

  <div class="ending" id="ending">
    <img class="hero" id="endImg" alt="" onerror="this.setAttribute('data-empty','1')">
    <div class="tag">END</div>
    <h2 id="endTitle">雾散</h2>
    <div id="endBody"></div>
    <div class="coda" id="endCoda"></div>
    <button class="again" id="again">再走一次</button>
  </div>

</div>

<script>
/* =========================================================
   AI 接入说明
   部署版：前端请求 /api/chat，由服务端 app.py 携带 token 调模型，
           token 不会出现在网页源码里。
   本地直开：没有 /api/chat 可用，会自动退回【本地对话引擎】，
           双击 index.html 也能完整玩到结局。
   ========================================================= */
const CONFIG = {
  endpoint: "/api/chat",
  aiEnabled: true
};

const KEY = "yiwang_jiuguan_v1";
const ROUNDS_BEFORE_CHOICE = 4;

/* ---------------- 状态 ---------------- */
let S = {
  trust: 40,
  secret: 0,
  memory: [],
  round: 0,
  phase: "talk",      // talk | choice | end
  history: [],        // 气泡记录
  busy: false
};

function save(){
  localStorage.setItem(KEY, JSON.stringify(S));
}
function load(){
  try{
    const raw = localStorage.getItem(KEY);
    if(raw){
      const p = JSON.parse(raw);
      if(p && typeof p.trust === "number") S = Object.assign(S, p);
    }
  }catch(e){}
}
function resetGame(){
  localStorage.removeItem(KEY);
  S = {trust:40, secret:0, memory:[], round:0, phase:"talk", history:[], busy:false};
  document.getElementById("ending").classList.remove("on");
  document.getElementById("bottom").style.display = "";
  document.getElementById("stage").innerHTML = "";
  refreshBars();
  begin();
}

/* ---------------- 界面 ---------------- */
const stage = document.getElementById("stage");
const input = document.getElementById("input");
const sendBtn = document.getElementById("send");
const hintEl = document.getElementById("hint");

function refreshBars(){
  document.getElementById("trustNum").textContent = S.trust;
  document.getElementById("secretNum").textContent = S.secret;
  document.getElementById("trustBar").style.width = S.trust + "%";
  document.getElementById("secretBar").style.width = S.secret + "%";
}

function addRow(who, text){
  const row = document.createElement("div");
  row.className = "row" + (who === "me" ? " me" : "");
  const b = document.createElement("div");
  b.className = "bubble " + (who === "me" ? "user" : "npc");
  b.textContent = text;
  row.appendChild(b);
  stage.appendChild(row);
  requestAnimationFrame(() => { stage.scrollTop = stage.scrollHeight; });
  S.history.push({who, text});
  save();
}

function addNarr(text){
  const p = document.createElement("p");
  p.className = "narr";
  p.textContent = text;
  stage.appendChild(p);
  requestAnimationFrame(() => { stage.scrollTop = stage.scrollHeight; });
}

function addThinking(){
  const d = document.createElement("div");
  d.className = "thinking";
  d.id = "think";
  d.textContent = "她在擦一只杯子。";
  stage.appendChild(d);
  requestAnimationFrame(() => { stage.scrollTop = stage.scrollHeight; });
}
function removeThinking(){
  const d = document.getElementById("think");
  if(d) d.remove();
}

/* ---------------- 开场 ---------------- */
function begin(){
  addNarr("雾很重。你在岔路口看见一盏灯。");
  addNarr("灯下是一扇门，门上没写名字。推门进去，柜台后站着一个人。");
  addNarr("她面前排着一列空杯。每一只空杯，都装着一个人放下的往事。");
  addNarr("她抬头看你，没有说话，只把一只空杯推到你面前。");
  addRow("npc", "坐吧。这里不卖酒。");
  addRow("npc", "你有什么想说的，就说。不想说，坐着也行。");
  addRow("npc", "杯子我先放着。");
  hintEl.textContent = "从哪儿开始都可以。中间也行。忘了的也行。";
}

/* ---------------- 本地对话引擎（没配 token 时用） ---------------- */
const LOCAL = {
  story: [
    ["我记得。往下说。", 4, 3],
    ["你讲到这里的时候，声音变了。", 5, 2],
    ["这句我先记着。你接着说。", 4, 3]
  ],
  probe: [
    ["我在这儿很久了。久到不记得从哪天起。", 1, 6],
    ["这里只做一件事：让人把话说完。", 2, 5],
    ["杯子是空的。放进去的东西，别人看不见。", 1, 7]
  ],
  silent: [
    ["那就先放这儿。", -1, 0],
    ["不说话的人也来过。后来坐了整夜。", -2, 0],
    ["不急着说。灯还亮着。", 0, 1]
  ],
  leave: [
    ["门一直开着。", -3, 0],
    ["走出去不会少什么。只是有些话，下次还得再说一遍。", -2, 3],
    ["想走就走。杯子我给你留着。", -3, 1]
  ]
};

function classify(text){
  const t = (text || "").trim();
  // 先认沉默与敷衍，避免"没什么好说的"因为带"什么"被误判成提问
  if(t.length <= 2 || /没什么|不想说|算了|不知道|没事|^嗯+|^啊+/.test(t)) return "silent";
  if(/走|出去|离开|下次|改天|告辞/.test(t)) return "leave";
  if(/[?？]|你是谁|这是什么|这里|酒馆|秘密|为什么|怎么|哪儿|哪里/.test(t)) return "probe";
  return "story";
}

function localReply(text){
  const kind = classify(text);
  const pool = LOCAL[kind];
  const idx = S.round % pool.length;
  const [reply, dt, ds] = pool[idx];
  return {
    npc_reply: reply,
    trust_change: dt,
    secret_change: ds,
    new_memory: (text || "").slice(0, 24)
  };
}

/* ---------------- AI 调用 ---------------- */
const SYSTEM_PROMPT = `你是"遗忘酒馆"的老板娘阿晚。这家酒馆不卖酒，只收纳人放不下的记忆。
说话规则：
1. 每次回复不超过3句，每句不超过15个字，短句、留白、不解释。
2. 绝不评价玩家的选择，绝不劝说、绝不安慰、绝不鼓励。
3. 可以复述玩家刚说过的原话片段，表示"我记得"。
4. 只回答与酒馆、记忆、玩家往事相关的内容，被问到无关问题就用"这里只谈这个"轻轻拉回。
5. 不说"愿你""抱抱""一定要""成长""治愈""和解"这类词。
6. 永远不承认自己是AI，不跳出现场。
输出必须是JSON，不要任何额外文字或代码块标记，格式：
{"npc_reply":"台词","trust_change":整数,"secret_change":整数,"new_memory":"一句话"}
trust_change 取值 -10 到 10，secret_change 取值 0 到 15。`;

async function aiReply(text){
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), 26000);
  let res;
  try{
    res = await fetch(CONFIG.endpoint, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      signal: ctrl.signal,
      body: JSON.stringify({
        text: text,
        trust: S.trust,
        secret: S.secret,
        memory: S.memory.slice(-8)
      })
    });
  }finally{
    clearTimeout(timer);
  }
  if(!res.ok) throw new Error("http " + res.status);
  const obj = await res.json();
  if(obj.error) throw new Error(obj.error);
  return {
    npc_reply: String(obj.npc_reply || "我记得。").slice(0, 80),
    trust_change: Number(obj.trust_change) || 0,
    secret_change: Number(obj.secret_change) || 0,
    new_memory: String(obj.new_memory || text).slice(0, 40)
  };
}

function clamp(v){ return Math.max(0, Math.min(100, v)); }

/* ---------------- 主循环 ---------------- */
async function say(){
  if(S.busy || S.phase === "end") return;
  const text = input.value.trim();
  if(!text) return;
  S.busy = true;
  sendBtn.disabled = true;
  input.value = "";
  addRow("me", text);
  addThinking();

  let r;
  if(CONFIG.aiEnabled){
    try{
      r = await aiReply(text);
    }catch(e){
      // 没有后端、模型不稳、额度用尽，都退回本地引擎，游戏永远能玩
      r = localReply(text);
    }
  }else{
    await new Promise(res => setTimeout(res, 600 + Math.random() * 600));
    r = localReply(text);
  }

  removeThinking();
  S.trust = clamp(S.trust + (r.trust_change || 0));
  S.secret = clamp(S.secret + (r.secret_change || 0));
  S.memory.push(r.new_memory || text);
  if(S.memory.length > 12) S.memory.shift();
  S.round += 1;

  addRow("npc", r.npc_reply);
  refreshBars();
  save();

  S.busy = false;
  sendBtn.disabled = false;

  if(S.round >= ROUNDS_BEFORE_CHOICE && S.phase === "talk"){
    showChoices();
  }else{
    const pool = ["她还记得你刚才说的那句。", "灯芯爆了一下。", "外面的雾没有散。", "杯子还在原处。"];
    hintEl.textContent = pool[S.round % pool.length];
  }
}

/* ---------------- 选项 ---------------- */
function showChoices(){
  S.phase = "choice";
  save();
  document.getElementById("bottom").style.display = "none";

  const box = document.createElement("div");
  box.className = "choices";
  box.innerHTML = `
    <p class="q">这只杯子，你要怎么用它？</p>
    <button class="choice" data-k="give"><span class="t">把这段记忆倒进去</span><span class="d">留在这里，往后不必再想起。</span></button>
    <button class="choice" data-k="keep"><span class="t">带走它，自己扛着</span><span class="d">谁也不替你拿，它一直是你的。</span></button>
    <button class="choice" data-k="tell"><span class="t">把它说完了，再走</span><span class="d">不给谁，也不带走。只是说完。</span></button>
    <p class="tip">选哪个，她都不会拦你。</p>
  `;
  stage.appendChild(box);
  requestAnimationFrame(() => { stage.scrollTop = stage.scrollHeight; });

  box.querySelectorAll(".choice").forEach(btn => {
    btn.addEventListener("click", () => {
      box.querySelectorAll(".choice").forEach(b => b.disabled = true);
      const k = btn.dataset.k;
      let id;
      if(k === "give") id = S.trust >= 50 ? "wusan" : "wusan_cold";
      else if(k === "keep") id = "chenmeng";
      else id = (S.secret >= 50 && S.trust >= 50) ? "guitu" : "guitu_half";
      setTimeout(() => ending(id), 300);
    });
  });
}

/* ---------------- 结局 ---------------- */
const ENDINGS = {
  wusan: {
    title: "雾散",
    body: "你把话说完，把杯子推回去。\n她接住，倒过来，什么都倒不出——雾从杯底升起来，很轻地散开。\n\n“行了。”她说，“你现在可以走了。”\n\n你推门出去。门外雾比来时淡。\n走了几步，忽然想不起来自己刚才为什么进去。\n\n可她还记得。",
    coda: "有些话，只要有人替你记着，就不算白说。"
  },
  wusan_cold: {
    title: "雾散",
    body: "你把杯子推回去。\n她收下了，却没有抬头。\n\n“放下吧。”她只说了这三个字。\n\n杯子里没有起雾。它空着，像从来没装过什么。\n你走出去的时候，觉得自己好像漏掉了一件事，又想不起是什么。\n\n她还记得。只是不打算告诉你了。",
    coda: "有些话，交给不愿记的人，等于没说过。"
  },
  chenmeng: {
    title: "沉梦",
    body: "你没有把杯子推回去。\n“我自己拿着。”你说。\n\n她点头，没劝你。给你添了第二杯，也没有再问。\n\n你在窗边坐下。外面的雾一直没散。\n记忆在你手里沉下去，不重，但一直在。\n灯亮到很晚，她也没催你走。\n\n后来有人推门进来，看见窗边坐着一个不说话的客人。\n她给对方推了一只空杯，说：“坐吧。这里不卖酒。”",
    coda: "扛着的人，不吭声，也一直在扛。"
  },
  guitu: {
    title: "归途",
    body: "你没有倒进去，也没有带走。\n你只是把那段话说完，一句一句，从头到尾。\n\n她一直听着，中间没有打断你。\n说完的时候，屋里很静。\n\n“我记得。”她说。就这三个字。\n\n你站起来，发现那段往事还在，但不再往下沉了。\n门开着。你走出去，雾在身后散出一条路。",
    coda: "不用放下，也不用扛着。说完就够了。"
  },
  guitu_half: {
    title: "归途",
    body: "你说完了，但没有说透。\n中间有几句话，你自己绕过去了。\n\n她听着，没有追问。\n“我记得。”她说。\n\n你起身出门。雾散了一点，又合回来。\n那条路还在前面，只是今天走不完。",
    coda: "没说完的话，会自己找下一次。"
  }
};

const END_IMG = {
  wusan: "ending_wusan.jpg",
  wusan_cold: "ending_wusan.jpg",
  chenmeng: "ending_chenmeng.jpg",
  guitu: "ending_guitu.jpg",
  guitu_half: "ending_guitu.jpg"
};

function ending(id){
  const e = ENDINGS[id] || ENDINGS.chenmeng;
  S.phase = "end";
  S.endingId = id;
  save();

  const img = document.getElementById("endImg");
  if(END_IMG[id]){
    img.src = END_IMG[id];
    img.removeAttribute("data-empty");
  }else{
    img.setAttribute("data-empty", "1");
  }

  document.getElementById("endTitle").textContent = e.title;
  document.getElementById("endBody").innerHTML = e.body.split("\n").map(l =>
    l.trim() === "" ? "<p style='margin:0 0 10px'></p>" : "<p>" + l + "</p>"
  ).join("");
  document.getElementById("endCoda").textContent = e.coda;
  document.getElementById("bottom").style.display = "none";
  document.getElementById("ending").classList.add("on");
}

/* ---------------- 事件 ---------------- */
sendBtn.addEventListener("click", say);
input.addEventListener("keydown", e => { if(e.key === "Enter") { e.preventDefault(); say(); } });
document.getElementById("reset").addEventListener("click", () => {
  if(confirm("杯子清空，就真的记不住了。确定？")) resetGame();
});
document.getElementById("again").addEventListener("click", resetGame);

/* ---------------- 启动：恢复存档或开场 ---------------- */
(function init(){
  load();
  refreshBars();

  if(S.phase === "end" && S.endingId){
    // 已经结束过，直接显示结局
    ending(S.endingId);
    return;
  }

  stage.innerHTML = "";
  if(S.history && S.history.length){
    // 有存档：回放之前的对话，并补一句"你回来得比我想的快"
    S.history.forEach(h => {
      const row = document.createElement("div");
      row.className = "row" + (h.who === "me" ? " me" : "");
      const b = document.createElement("div");
      b.className = "bubble " + (h.who === "me" ? "user" : "npc");
      b.textContent = h.text;
      row.appendChild(b);
      stage.appendChild(row);
    });
    addRow("npc", S.memory.length ? "你回来得比我想的快。" : "上次那杯，我还留着。");
    hintEl.textContent = "接着说也行。";
    if(S.phase === "choice") showChoices();
  }else{
    begin();
  }
})();
</script>
</body>
</html>
